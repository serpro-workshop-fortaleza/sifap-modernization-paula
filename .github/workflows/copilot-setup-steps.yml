name: "Copilot setup steps"

# Preinstalls the immersion toolchain in the cloud Copilot agent environment
# so requests delegated in Stage 4 (see .github/agents/evolution.agent.md)
# start with Java 21, Node 20 + pnpm, and Terraform already available.
#
# Contract (docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent):
#   - the file MUST be named copilot-setup-steps.yml
#   - the job MUST be named copilot-setup-steps
#   - only steps, permissions, runs-on, services, snapshot, and timeout-minutes are recognized
#   - takes effect only after merging into the default branch
#
# backend/ and frontend/ do not exist until the team creates them in Stage 3, so these
# dependency steps are guarded and the workflow stays green before the prototype exists.
# The team may create infra/ in Stages 3/4; that step is also guarded.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    name: Copilot setup steps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # `cache: maven` makes setup-java fail with "No file ... matched to [**/pom.xml]" when
      # backend/ does not exist, the normal state until Stage 3. Deriving the mode from
      # the tree keeps the run green before the prototype exists and still restores
      # the Maven cache once the team tracks backend/pom.xml.
      - name: Determine Maven cache mode
        id: maven-cache
        run: |
          set -euo pipefail
          if [ -f backend/pom.xml ]; then
            echo "mode=maven" >> "$GITHUB_OUTPUT"
          else
            echo "mode=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: ${{ steps.maven-cache.outputs.mode }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          # Version used by the kit for Terraform modules created in Stage 4.
          terraform_version: "1.14.6"

      - name: Prepare backend dependencies
        run: |
          set -euo pipefail
          if [ -f backend/pom.xml ]; then
            cd backend && ./mvnw -B -q dependency:go-offline
          else
            echo "backend/ has not been created yet (Stage 3) - skipping."
          fi

      - name: Prepare frontend dependencies
        run: |
          set -euo pipefail
          if [ -f frontend/pnpm-lock.yaml ]; then
            cd frontend && pnpm install --frozen-lockfile
          elif [ -f frontend/package.json ]; then
            cd frontend && pnpm install
          else
            echo "frontend/ has not been created yet (Stage 3) - skipping."
          fi

      - name: Prepare Terraform providers
        run: |
          set -euo pipefail
          if [ ! -d infra ]; then
            echo "infra/ has not been created yet (Stage 3/4) - skipping."
            exit 0
          fi
          modules=$(find infra -type f -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)
          if [ -z "$modules" ]; then
            echo "infra/ does not contain Terraform modules yet - skipping."
            exit 0
          fi
          echo "$modules" | while read -r module; do
            terraform -chdir="$module" init -backend=false -input=false
          done
