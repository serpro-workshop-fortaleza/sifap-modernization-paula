name: Implementation task
description: A single scoped implementation task derived from a specification
title: "[T-NNN] "
labels: [ "task", "stage-3" ]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        > Use this template for one implementation task at a time.
        > Tasks come from `specs/<NNN>-<feature>/tasks.md`.

  - type: input
    id: task-id
    attributes:
      label: Task ID
      placeholder: "T-007"
    validations:
      required: true

  - type: input
    id: feature-folder
    attributes:
      label: Feature folder
      placeholder: "specs/<NNN>-<feature>/"
    validations:
      required: true

  - type: input
    id: req-ids
    attributes:
      label: Implemented REQ-IDs
      description: Comma-separated list of all requirement IDs implemented by this task.
      placeholder: "REQ-XXX, REQ-YYY"
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria (from the specification)
      description: Copy from `spec.md` so the implementer does not need to switch
        between files.
      placeholder: |
        - When <event>, the system SHALL <verifiable behavior>.
        - If <condition>, the system SHALL NOT <prohibited behavior>.
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Complexity estimate
      options:
        - XS (<1h)
        - S (1-2h)
        - M (2-4h)
        - L (4-8h)
        - XL (>1 day)
    validations:
      required: true

  - type: dropdown
    id: lead-persona
    attributes:
      label: Lead persona
      options:
        - Developer
        - DBA
        - QA Engineer
        - DevOps Engineer
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Depends on
      placeholder: |
        - T-XXX (prerequisite task)
        - ADR-XXXX (relevant decision)

  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of done
      value: |
        - [ ] At least one test per acceptance criterion (red -> green -> refactor)
        - [ ] Every public method implementing a `REQ-ID` has Javadoc with `@implements REQ-NNN`
        - [ ] CI is green (build, static analysis, type checks, tests, and coverage)
        - [ ] The corresponding checkbox in `tasks.md` is checked
        - [ ] The pull request (PR) title uses Conventional Commits and links this issue
        - [ ] At least one review from the persona pair on the pull request
    validations:
      required: true
