name: Architecture Decision Record (ADR)
description: Document a significant architecture or design decision
title: "[ADR] "
labels: [ "adr", "stage-2", "architecture" ]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        > Use this template for a nontrivial decision (>1 hour to revisit later).
        > Examples: choosing between a monolith and microservices, persistence strategy, authentication model.

  - type: input
    id: adr-number
    attributes:
      label: ADR number (sequential)
      placeholder: "0007"
    validations:
      required: true

  - type: input
    id: adr-title
    attributes:
      label: Title
      placeholder: "<short decision title>"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What observed problem motivates this decision?
      placeholder: "<evidence, constraints, and decision to make>"
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: Decision
      description: The change we propose or have agreed to make.
      placeholder: "<decision explicitly made by the team>"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: |
        - <alternative A> - <trade-off>
        - <alternative B> - <trade-off>
    validations:
      required: true

  - type: textarea
    id: consequences
    attributes:
      label: Consequences
      description: What becomes easier? What becomes harder? Are there any risks?
      placeholder: |
        Easier: <effect>
        Harder: <effect>
        Mitigation: <action>
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - proposed
        - accepted
        - deprecated
        - superseded
    validations:
      required: true

  - type: input
    id: supersedes
    attributes:
      label: Supersedes (ADR number, if any)
      placeholder: "Not applicable"

  - type: dropdown
    id: lead-persona
    attributes:
      label: Authoring persona
      options:
        - Enterprise Architect
        - Software Architect
        - Technical Lead
    validations:
      required: true
