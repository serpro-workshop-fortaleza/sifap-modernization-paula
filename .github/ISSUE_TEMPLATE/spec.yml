name: Specification request
description: Propose a new feature specification (Stage 2 - Specification)
title: "[SPEC] "
labels: ["spec", "stage-2"]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        > Use this template when starting a new specification in `specs/<NNN>-<feature>/`.
        > The Requirements Engineer or Product Owner usually opens this issue.

  - type: input
    id: feature-id
    attributes:
      label: Feature ID
      description: Three-digit number that must match the folder name in `specs/`
      placeholder: "003"
    validations:
      required: true

  - type: input
    id: feature-name
    attributes:
      label: "Feature name (kebab-case: lowercase words separated by hyphens)"
      placeholder: "<feature-name>"
    validations:
      required: true

  - type: textarea
    id: business-goal
    attributes:
      label: Business goal
      description:
        What outcome does this feature enable? Link it to a SIFAP business rule
        when possible.
      placeholder: "<describe the outcome identified by the team>"
    validations:
      required: true

  - type: textarea
    id: ears-requirements
    attributes:
      label: Initial EARS requirements (draft)
      description: Use the 6 EARS patterns. The Requirements Engineer will refine them.
      value: |
        - REQ-XXX-001 (Ubiquitous): The system SHALL ...
        - REQ-XXX-002 (Event-driven): When ..., the system SHALL ...
        - REQ-XXX-003 (State-driven): While ..., the system SHALL ...
    validations:
      required: true

  - type: textarea
    id: source-legacy
    attributes:
      label: Legacy traceability (source_legacy)
      description: Every REQ-ID must cite a Natural .NSN file, an Adabas .ddm file, or new behavior justified with the [GREENFIELD] token.
      value: |
        source_legacy: 01-archaeology/legacy-sifap/natural-programs/<FILE>.NSN#L<start>-L<end>
        # or, for new behavior: source_legacy: "[GREENFIELD] <one-line justification>"
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: How will specification completeness be verified?
      placeholder: |
        - [ ] Every requirement uses a valid EARS pattern
        - [ ] Every requirement is testable
        - [ ] The Product Owner has approved the scope
    validations:
      required: true

  - type: dropdown
    id: lead-persona
    attributes:
      label: Lead persona
      options:
        - Requirements Engineer
        - Product Owner
        - Software Architect
        - Enterprise Architect
    validations:
      required: true
